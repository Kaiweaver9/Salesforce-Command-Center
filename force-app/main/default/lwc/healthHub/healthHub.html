<template>
    <div class="health-card">
        <!-- Persistent Top HUD Header (Symmetric with Goal Projection) -->
        <div class="card-header">
            <button class="header-title-btn" onclick={handleNavigateHealth} title="Open Full Health Intelligence Workspace">
                <span class="header-root">HEALTH · </span>
                <span class="header-active">{activeSlideTitle}</span>
            </button>
            <span class={statusBadgeClass}>{clinicalStatus}</span>
        </div>

        <!-- Card-Level Left / Right Arrows (Aligned 1:1 with Goal Projection) -->
        <button class="nav-arrow left-arrow" onclick={handlePrevSlide} aria-label="Previous slide">❮</button>
        <button class="nav-arrow right-arrow" onclick={handleNextSlide} aria-label="Next slide">❯</button>

        <!-- Carousel Stage -->
        <div class="carousel-stage">
            <div class="slide-body">
                <!-- SLIDE 1: DAILY ENERGY (GRADIENT HERO RADIAL RING) -->
                <template lwc:if={isSlideOne}>
                    <div class="slide-one-hero">
                        <div class="hero-ring-stage" onmouseleave={handleMacroLeave}>
                            <!-- Native Shadow-DOM-Proof Gradient SVG -->
                            <svg class="hero-energy-svg" viewBox="0 0 200 155" lwc:dom="manual"></svg>

                            <!-- Center Telemetry Readout -->
                            <div class="hero-ring-center">
                                <span class={heroRingEyebrowClass}>{ringCenterEyebrow}</span>
                                <span class="hero-ring-value">{ringCenterPrimary}</span>
                                <span class="hero-ring-sub">{ringCenterSecondary}</span>
                            </div>
                        </div>

                        <!-- Interactive Legend & Calorie Delta Pill -->
                        <div class="hero-legend-strip" onmouseleave={handleMacroLeave}>
                            <span class="legend-chip" data-macro="PROTEIN" onmouseenter={handleMacroHover} onmouseleave={handleMacroLeave} onclick={handleMacroTap}>
                                <span class="macro-dot protein-bg"></span>P {actualProteinPct}%
                            </span>
                            <span class="legend-chip" data-macro="CARBS" onmouseenter={handleMacroHover} onmouseleave={handleMacroLeave} onclick={handleMacroTap}>
                                <span class="macro-dot carbs-bg"></span>C {actualCarbsPct}%
                            </span>
                            <span class="legend-chip" data-macro="FAT" onmouseenter={handleMacroHover} onmouseleave={handleMacroLeave} onclick={handleMacroTap}>
                                <span class="macro-dot fat-bg"></span>F {actualFatPct}%
                            </span>
                            <span class={calorieDeltaBadgeClass}>{calorieDeltaLabel}</span>
                        </div>
                    </div>
                </template>

                <!-- SLIDE 2: DAILY MACROS (SPACIOUS 3-CARD LAYOUT + GRADIENT SPLIT BAR) -->
                <template lwc:if={isSlideTwo}>
                    <div class="slide-two-macros">
                        <div class="macro-cards-grid">
                            <!-- Protein Card -->
                            <div class="macro-card card-protein">
                                <div class="macro-card-header">
                                    <span class="macro-dot protein-bg"></span>
                                    <span class="macro-card-title">PROTEIN</span>
                                </div>
                                <div class="macro-card-metric">
                                    <span class="macro-actual">{proteinGrams}</span>
                                    <span class="macro-target">/{targetProteinGrams}g</span>
                                </div>
                                <div class={macroProteinDeltaClass}>{macroProteinDeltaLabel}</div>
                            </div>

                            <!-- Carbs Card -->
                            <div class="macro-card card-carbs">
                                <div class="macro-card-header">
                                    <span class="macro-dot carbs-bg"></span>
                                    <span class="macro-card-title">CARBS</span>
                                </div>
                                <div class="macro-card-metric">
                                    <span class="macro-actual">{carbsGrams}</span>
                                    <span class="macro-target">/{targetCarbsGrams}g</span>
                                </div>
                                <div class={macroCarbsDeltaClass}>{macroCarbsDeltaLabel}</div>
                            </div>

                            <!-- Fat Card -->
                            <div class="macro-card card-fat">
                                <div class="macro-card-header">
                                    <span class="macro-dot fat-bg"></span>
                                    <span class="macro-card-title">FAT</span>
                                </div>
                                <div class="macro-card-metric">
                                    <span class="macro-actual">{fatGrams}</span>
                                    <span class="macro-target">/{targetFatGrams}g</span>
                                </div>
                                <div class={macroFatDeltaClass}>{macroFatDeltaLabel}</div>
                            </div>
                        </div>

                        <!-- Full-Width Gradient Macro Split Comparison Bar -->
                        <div class="ratio-comparison">
                            <div class="ratio-labels">
                                <span class="actual-split-group">
                                    <span class="label-green">P {actualProteinPct}%</span>
                                    <span class="split-sep"> · </span>
                                    <span class="label-blue">C {actualCarbsPct}%</span>
                                    <span class="split-sep"> · </span>
                                    <span class="label-slate">F {actualFatPct}%</span>
                                </span>
                                <span class="target-split-label">TARGET 30 · 45 · 25</span>
                            </div>
                            <svg class="horizontal-bar-svg macro-split-svg" viewBox="0 0 300 9" preserveAspectRatio="none" lwc:dom="manual"></svg>
                        </div>
                    </div>
                </template>

                <!-- SLIDE 3: 7-DAY MACRO TRENDS (GRADIENT STACKED BARS) -->
                <template lwc:if={isSlideThree}>
                    <div class="slide-three-trends">
                        <div class="trends-top-block">
                            <div class="trends-period-label">{trendsHeaderLabel}</div>

                            <div class="trends-readout-grid">
                                <div class="trend-stat-col">
                                    <span class="trend-pill"><span class="macro-dot protein-bg"></span>PROTEIN</span>
                                    <span class="trend-pct">{displayTrendProteinPct}% <span class="trend-target-hint">(30%)</span></span>
                                    <span class="trend-grams">{displayTrendProteinGrams}</span>
                                </div>
                                <div class="trend-stat-col">
                                    <span class="trend-pill"><span class="macro-dot carbs-bg"></span>CARBS</span>
                                    <span class="trend-pct">{displayTrendCarbsPct}% <span class="trend-target-hint">(45%)</span></span>
                                    <span class="trend-grams">{displayTrendCarbsGrams}</span>
                                </div>
                                <div class="trend-stat-col">
                                    <span class="trend-pill"><span class="macro-dot fat-bg"></span>FAT</span>
                                    <span class="trend-pct">{displayTrendFatPct}% <span class="trend-target-hint">(25%)</span></span>
                                    <span class="trend-grams">{displayTrendFatGrams}</span>
                                </div>
                            </div>
                        </div>

                        <!-- Native Shadow-DOM-Proof Gradient 7-Day Columns -->
                        <div class="trends-chart-stage" onmouseleave={handleBarLeave}>
                            <svg class="trends-bars-svg" viewBox="0 0 280 96" preserveAspectRatio="none" lwc:dom="manual"></svg>
                            <div class="trends-day-labels">
                                <template for:each={sevenDayBars} for:item="bar">
                                    <span
                                        key={bar.dateKey}
                                        class={bar.dayLabelClass}
                                        data-index={bar.index}
                                        onmouseenter={handleBarHover}
                                        onclick={handleBarTap}>
                                        {bar.dayLabel}
                                    </span>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- SLIDE 4: BODY COMPOSITION (GRADIENT LEAN/FAT BAR) -->
                <template lwc:if={isSlideFour}>
                    <div class="slide-four-comp">
                        <div class="comp-bar-section">
                            <div class="comp-overview-header">
                                <span class="comp-callout">
                                    {compositionCallout}
                                    <template lwc:if={compositionArrow}>
                                        <span class="comp-muted-arrow"> {compositionArrow}</span>
                                    </template>
                                </span>
                                <span class="comp-split-numbers">
                                    <span class="label-green">LEAN {leanMassPct}%</span>
                                    <span class="split-sep"> · </span>
                                    <span class="label-slate">FAT {bodyFatPct}%</span>
                                </span>
                            </div>
                            <svg class="horizontal-bar-svg comp-split-svg" viewBox="0 0 300 9" preserveAspectRatio="none" lwc:dom="manual"></svg>
                        </div>

                        <div class="tissue-grid">
                            <div class="tissue-card">
                                <div class="tissue-title">LEAN MASS</div>
                                <div class="tissue-main">
                                    <span class="tissue-val">{leanMassLbs} <span class="unit-small">LBS</span></span>
                                    <span class={tissueLeanDeltaClass}>{tissueLeanDeltaLabel}</span>
                                </div>
                            </div>

                            <div class="tissue-card">
                                <div class="tissue-title">FAT MASS</div>
                                <div class="tissue-main">
                                    <span class="tissue-val">{fatMassLbs} <span class="unit-small">LBS</span></span>
                                    <span class={tissueFatDeltaClass}>{tissueFatDeltaLabel}</span>
                                </div>
                            </div>
                        </div>

                        <div class="biomarker-strip">
                            <span>WEIGHT: <strong>{formattedCurrentWeight} LBS</strong></span>
                            <span>BODY FAT: <strong>{bodyFatPct}%</strong></span>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- 4-Slide Pagination Dots -->
        <div class="carousel-dots">
            <span class={dot0Class} data-slide="0" onclick={handleDotClick}></span>
            <span class={dot1Class} data-slide="1" onclick={handleDotClick}></span>
            <span class={dot2Class} data-slide="2" onclick={handleDotClick}></span>
            <span class={dot3Class} data-slide="3" onclick={handleDotClick}></span>
        </div>

        <!-- Persistent Bottom Telemetry Bar -->
        <div class="telemetry-footer">
            <div class="telemetry-item">
                <span class="tele-label">TDEE</span>
                <span class="tele-val">{formattedTdee}</span>
            </div>
            <span class="tele-divider">|</span>
            <div class="telemetry-item">
                <span class="tele-label">WEEKLY AVG</span>
                <span class={velocityValueClass}>{formattedWeeklyAvg}</span>
            </div>
            <span class="tele-divider">|</span>
            <div class="telemetry-item">
                <span class="tele-label">TARGET</span>
                <span class="tele-val target-green">{formattedTargetCalories}</span>
            </div>
        </div>
    </div>
</template>
